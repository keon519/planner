name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check app/ || true

      - name: Import check
        run: python -c "from app.main import app; print('app imports cleanly')"
        env:
          ANTHROPIC_API_KEY: test-key-not-used

      - name: Unit tests
        run: pytest tests/ -q
        env:
          ANTHROPIC_API_KEY: test-key-not-used
          TZ: America/New_York
